<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Image Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div x-data="gallery" x-init="fetchContents()" @scroll.window="handleScroll">
    
    <div class="toolbar">
        <div class="toolbar-controls">
            <label><input type="checkbox" @change="toggleAll($event)" x-model="selectAll"> Seleziona tutti</label>
            <button class="btn-download" :disabled="!selectedContents.length" @click="downloadSelected">Download</button>
            <span class="results">Immagini selezionate: <span x-text="selectedContents.length"></span> / <span x-text="contents.length"></span></span>
        </div>
    </div>

    <div class="flex">
        <template x-for="(content, index) in contents" :key="content.id">
            <div class="card">
                <div class="card-control">
                    <input type="checkbox" class="contentCheckbox" :value="content.id" x-model="selectedContents">
                </div>
                <div class="image-container" @click="openModal(index)">
                    <template x-if="content.filetype === 'image'">
                        <img :src="content.url" :alt="content.title">
                        <span class="filetype" x-text="content.filetype"></span>
                    </template>
                    <template x-if="content.filetype === 'video'">
                        <video controls>
                            <source :src="content.url" type="video/mp4">
                            <span class="filetype" x-text="content.filetype"></span>
                        </video>
                    </template>
                    <template x-if="content.filetype === 'pdf'">
                        <iframe :src="content.url" type="application/pdf" width="100%" height="200px"></iframe>
                    </template>
                </div>
                <div class="info">
                    <div class="title" x-text="content.title"></div>
                </div>
            </div>
        </template>
    </div>

    <div x-show="loading" class="loading">Caricamento...</div>
    <div class="privacy">Privacy policy</div>

    <!-- MODALE -->
    <div x-show="isModalOpen" class="modal-overlay" @click="closeModal()">
        <div class="modal" @click.stop>
            <div class="title-container">
                <div class="title" x-text="currentContent.title"></div>
                <button class="close-btn" @click="closeModal()">✖</button>
            </div>
            <div class="modal-content">
                <div class="zoom-container" @wheel.prevent="zoom($event)">
                    <template x-if="currentContent.filetype === 'image'">
                        <img :src="currentContent.url" :alt="currentContent.title">
                        <span class="filetype" x-text="currentContent.filetype"></span>
                    </template>
                    <template x-if="currentContent.filetype === 'video'">
                        <video controls>
                            <source :src="currentContent.url" type="video/mp4">
                            <span class="filetype" x-text="currentContent.filetype"></span>
                        </video>
                    </template>
                    <template x-if="currentContent.filetype === 'pdf'">
                        <iframe :src="currentContent.url" type="application/pdf" width="100%" height="200px"></iframe>
                    </template>
                </div>
            </div>
            <div class="modal-controls">
                <button class="btn" @click="prevContent()">← Prev</button>
                <button class="btn" @click="downloadContent()">Download</button>
                <button class="btn" @click="nextContent()">Next →</button>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('gallery', () => ({
        randomUrl:["https://ferrari-view.thron.com/api/xcontents/resources/delivery/getThumbnail/ferrari/400x400/c21600fb-9447-4e0f-87aa-08fc90b10c23.jpg?v=367","https://ferrari-cdn.thron.com/api/xcontents/resources/delivery/getThumbnail/ferrari/400x400/38a0205e-00a6-4ac3-8bb4-9d22259a49e9.jpg?v=361","https://ferrari-cdn.thron.com/api/xcontents/resources/delivery/getThumbnail/ferrari/400x400/b378fa6a-1838-4e0d-b265-9e9c778edfd9.jpg?v=371","https://ferrari-cdn.thron.com/api/xcontents/resources/delivery/getThumbnail/ferrari/400x400/78a38f9c-89eb-4de8-b6a4-5410a06ad088.jpg?v=212","http://ferrari-view.thron.com/api/xcontents/resources/delivery/getThumbnail/ferrari/400x400/584e65fa-69ff-4b81-acf5-998535d89d29.jpg?v=367"],
        // randomUrl:["https://ferrari-cdn.thron.com/static/UMHOCR_0_FERRARI_167_COMBINATION_FILM_16X9_FINAL_9R8W69.mp4"],
        contents: [],
        selectedContents: [],
        selectAll: false,
        loading: false,
        page: 1,
        perPage: 10,
        unsplashApiKey: "c4Zh1VHp6WeGk6PUhv_3i_xpz_M6D_5qsmq1Bmi5C1g",

        isModalOpen: false,
        currentIndex: 0,
        zoomLevel: 1,

        get currentContent() {
            return this.contents[this.currentIndex] || {};
        },

        async fetchContents() {
            if (this.loading) return;
            this.loading = true;

            try {
                const response = await fetch(`https://api.unsplash.com/search/photos?query=ferrari&page=${this.page}&per_page=${this.perPage}&client_id=${this.unsplashApiKey}`);
                const data = await response.json();

                // this.contents = [...this.contents, ...data.results.map(img => ({
                //     id: img.id,
                //     url: "https://ferrari-view.thron.com/api/xcontents/resources/delivery/getThumbnail/ferrari/400x400/c21600fb-9447-4e0f-87aa-08fc90b10c23.jpg?v=367",
                //     title: img.alt_description || "Ferrari Image",
                //     filetype: 'JPG',
                // }))];

                this.contents = [
                    ...this.contents,
                    ...data.results.map(img => {
                        const randomIndex = Math.floor(Math.random() * this.randomUrl.length);
                        return {
                            id: img.id,
                            url: this.randomUrl[randomIndex], // Usa this.randomUrl invece di randomUrl
                            title: img.alt_description || "Ferrari Image",
                            filetype: 'video',
                        };
                    })
                ];


                this.page++;
            } catch (error) {
                console.error("Errore nel recupero delle immagini:", error);
            } finally {
                this.loading = false;
            }
        },

        handleScroll() {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
                this.fetchContents();
            }
        },

        toggleAll(event) {
            this.selectedContents = event.target.checked ? this.contents.map(img => img.id) : [];
        },

        async downloadSelected() {
            if (!this.selectedContents.length) return alert("Nessuna immagine selezionata.");

            let zip = new JSZip();
            let imgFolder = zip.folder("ferrari_international_media_test_drive");

            await Promise.all(this.selectedContents.map(async (contentId) => {
                let content = this.contents.find(img => img.id === contentId);
                if (content) {
                    try {
                        let response = await fetch(content.url);
                        let blob = await response.blob();
                        imgFolder.file(content.title.replace(/\s+/g, "_") + "." + content.filetype, blob);
                    } catch (error) {
                        console.error("Errore nel download di", content.url, error);
                    }
                }
            }));

            zip.generateAsync({ type: "blob" }).then(content => saveAs(content, "ferrari_international_media_test_drive.zip"));
        },

        openModal(index) {
            this.currentIndex = index;
            this.zoomLevel = 1;
            this.isModalOpen = true;
        },

        closeModal() {
            this.isModalOpen = false;
        },

        nextContent() {
            this.currentIndex = (this.currentIndex + 1) % this.contents.length;
            this.zoomLevel = 1;
        },

        prevContent() {
            this.currentIndex = (this.currentIndex - 1 + this.contents.length) % this.contents.length;
            this.zoomLevel = 1;
        },

        zoom(event) {
            let scaleStep = 0.1;
            if (event.deltaY < 0 && this.zoomLevel < 5) {
                this.zoomLevel += scaleStep;
            } else if (event.deltaY > 0 && this.zoomLevel > 1) {
                this.zoomLevel -= scaleStep;
            }
        },

        downloadContent() {
            fetch(this.currentContent.url)
                .then(res => res.blob())
                .then(blob => saveAs(blob, this.currentContent.title + ".jpg"))
                .catch(error => console.error("Errore nel download:", error));
        }
    }));
});
</script>

</body>
</html>
