<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Image Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div x-data="gallery" x-init="fetchContents()" @scroll.window="handleScroll">
    
    <div class="toolbar">
        <div class="toolbar-content">
            <div class="selection-row">
                <label><input type="checkbox" @change="toggleAll($event)" x-model="selectAll"> Select all</label>
                <span class="results">Selected assets: <span x-text="selectedContents.length"></span> / <span x-text="contents.length"></span></span>
            </div>
            <button class="btn-download" 
                    :disabled="!selectedContents.length || isDownloading" 
                    @click="downloadSelected">
                    <span x-show="isDownloading" class="loading-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="loading-svg">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.3"></circle>
                            <path d="M12 2 A10 10 0 0 1 22 12" stroke="black"></path>
                        </svg>
                    </span>
                <span x-show="!isDownloading">Download</span>
            </button>
        </div>
    </div>

    <div class="flex">
        <template x-for="(content, index) in contents" :key="content.id">
            <div class="card">
                <div class="card-control">
                    <input type="checkbox" class="contentCheckbox" :value="content.id" x-model="selectedContents">
                    <span class="filetype" x-text="content.filetype"></span>
                </div>
                <div class="image-container" @click="openModal(index)">
                    <template x-if="content.contentType === 'image'">
                        <img :src="content.url" :alt="content.title">
                        
                    </template>
                    <template x-if="content.contentType === 'video'">
                        <div class="video-thumbnail">
                            <img :src="content.thumbnailUrl" :alt="content.title">
                            <button class="play-button">
                                ▶
                            </button>
                        </div>
                    </template>
                    <template x-if="content.contentType === 'pdf'">
                        <img :src="content.thumbnailUrl" :alt="content.title">
                    </template>
                </div>
                <div class="info">
                    <div class="title" x-text="content.title"></div>
                </div>
            </div>
        </template>
    </div>

    <div x-show="loading" class="loading">Caricamento...</div>
    <div class="privacy">Privacy policy</div>

    <!-- MODALE -->
    <div x-show="isModalOpen" class="modal-overlay" @click="closeModal()">
        <div class="modal" @click.stop>
            <div class="title-container">
                <div class="title" x-text="currentContent.title"></div>
                <div class="title-container-control">
                    <button class="close-btn no-phone" @click="expandModal()">⛶</button>
                    <button class="close-btn" @click="closeModal()">✖</button>
                </div>
                
            </div>
            <div class="modal-content">
                <template x-if="currentContent.contentType === 'image'">
                    <div class="zoom-container" @wheel.prevent="zoom($event)">
                        <img :src="currentContent.url" :alt="currentContent.title" 
                             :style="'transform: scale(' + zoomLevel + ');'">
                    </div>
                </template>

                    <template x-if="currentContent.contentType === 'video'">
                        <video :key="currentIndex.url"controls="" autoplay="" name="media":src= "currentContent.url" type="video/mp4"></video>
                    </template>

                    <template x-if="currentContent.contentType === 'pdf'">
                        <iframe :src="currentContent.url"  :key="currentIndex.url" width="100%" height="100%"></iframe>
                    </template>
            </div>
            <div class="modal-controls">
                <button class="btn btn-modal" @click="prevContent()">← Prev</button>
                <button class="btn btn-modal" @click="downloadContent()">Download</button>
                <button class="btn btn-modal" @click="nextContent()">Next →</button>
            </div>
        </div>
    </div>

</div>

<script src="./script.js"></script>

</body>
</html>
