<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferrari Image Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div x-data="gallery" x-init="fetchContents()" @scroll.window="handleScroll">
    
    <div class="toolbar">
        <div class="toolbar-content">
            <div class="selection-row">
                <label><input type="checkbox" @change="toggleAll($event)" x-model="selectAll"> Select all</label>
                <span class="results">Selected images: <span x-text="selectedContents.length"></span> / <span x-text="contents.length"></span></span>
            </div>
            <button class="btn-download" :disabled="!selectedContents.length" @click="downloadSelected">Download</button>
        </div>
    </div>

    <div class="flex">
        <template x-for="(content, index) in contents" :key="content.id">
            <div class="card">
                <div class="card-control">
                    <input type="checkbox" class="contentCheckbox" :value="content.id" x-model="selectedContents">
                    <span class="filetype" x-text="content.filetype"></span>
                </div>
                <div class="image-container" @click="openModal(index)">
                    <template x-if="content.contentType === 'image'">
                        <img :src="content.url" :alt="content.title">
                        
                    </template>
                    <template x-if="content.contentType === 'video'">
                        <div class="video-thumbnail">
                            <img :src="content.thumbnailUrl" :alt="content.title">
                            <button class="play-button">
                                ▶
                            </button>
                        </div>
                        <!-- <video controls>
                            <source :src="content.url" type="video/mp4">
                            <span class="filetype" x-text="content.filetype"></span>
                        </video> -->
                    </template>
                    <template x-if="content.contentType === 'pdf'">
                        <iframe :src="content.url" type="application/pdf" width="100%" height="200px"></iframe>
                    </template>
                </div>
                <div class="info">
                    <div class="title" x-text="content.title"></div>
                </div>
            </div>
        </template>
    </div>

    <div x-show="loading" class="loading">Caricamento...</div>
    <div class="privacy">Privacy policy</div>

    <!-- MODALE -->
    <div x-show="isModalOpen" class="modal-overlay" @click="closeModal()">
        <div class="modal" @click.stop>
            <div class="title-container">
                <div class="title" x-text="currentContent.title"></div>
                <button class="close-btn" @click="closeModal()">✖</button>
            </div>
            <div class="modal-content">
                <template x-if="currentContent.contentType === 'image'">
                    <div class="zoom-container" @wheel.prevent="zoom($event)">
                        <img :src="currentContent.url" :alt="currentContent.title" 
                             :style="'transform: scale(' + zoomLevel + ');'">
                    </div>
                </template>
                    <template x-if="currentContent.contentType === 'video'">
                        <iframe 
                            src="https://ferrari.scene7.com/s7viewers/html5/VideoViewer.html?asset=ferraristage/wp_miami_2024_v6__1080p-AVS&videoserverurl=https://ferrari.scene7.com/is/content/&serverurl=https://ferrari.scene7.com/is/image/&contenturl=https://ferrari.scene7.com/is/content&config=/ferraristage/SmartCropVideo_social|SMART_CROP_VIDEO|false" 
                            allow="fullscreen"
                            overflow="hidden">
                        </iframe>
                    </template>
                    <template x-if="currentContent.contentType === 'pdf'">
                        <iframe :src="currentContent.url" type="application/pdf" width="100%" height="200px"></iframe>
                    </template>
            </div>
            <div class="modal-controls">
                <button class="btn btn-modal" @click="prevContent()">← Prev</button>
                <button class="btn btn-modal" @click="downloadContent()">Download</button>
                <button class="btn btn-modal" @click="nextContent()">Next →</button>
            </div>
        </div>
    </div>

</div>

<script src="./script.js"></script>

</body>
</html>
